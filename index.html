<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return a
         real number. Without it the bottom bar sits under the home
         indicator on every recent iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Rona OS — Executive Operating System</title>
    <meta name="description" content="A calm view of what deserves attention today." />

    <!-- Browser chrome takes the page colour rather than fighting it -->
    <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#FAF8F3" />

    <!-- Added to the home screen, it opens without Safari's chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rona OS" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Last resort. If the module above fails to parse or run, React
         never mounts and the error boundary never gets a chance. This
         is deliberately old-fashioned JavaScript so it survives on a
         browser that just rejected the modern bundle. -->
    <script>
      (function () {
        var shown = false;
        function paint(what) {
          if (shown) return;
          shown = true;
          var r = document.getElementById('root');
          if (!r) return;
          r.innerHTML =
            '<div style="padding:28px 20px;font:15px/1.5 -apple-system,sans-serif;color:#22211F">' +
            '<p style="font-size:20px;margin:0 0 10px">This did not load.</p>' +
            '<p style="color:#6B675F;margin:0 0 16px">The page failed before it could start. ' +
            'Send this screen on and it can be fixed properly.</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace;' +
            'background:#F4F1E8;border-left:2px solid #9E2B20;border-radius:5px;padding:12px;margin:0 0 12px">' +
            String(what).slice(0, 600) + '</pre>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font:11px/1.5 ui-monospace,Menlo,monospace;' +
            'color:#857F74;background:#F4F1E8;border-radius:5px;padding:12px;margin:0">' +
            navigator.userAgent + '</pre></div>';
        }
        window.addEventListener('error', function (e) {
          paint((e && e.message) || 'Script error');
        });
        window.addEventListener('unhandledrejection', function (e) {
          paint((e && e.reason && e.reason.message) || e.reason || 'Promise rejected');
        });
        // Nothing thrown, but nothing rendered either — also a failure.
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && r.children.length === 0) {
            paint('The app loaded without error but rendered nothing.');
          }
        }, 4000);
      })();
    </script>
  </body>
</html>
